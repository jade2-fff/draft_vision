# ============================================================
# dart.yaml — 飞镖自动瞄准配置文件
# ============================================================

enemy_color: "red"

#####-----飞镖靶检测参数 (传统CV)-----#####
dart_detector:
  gui: false
  HSV:
    lowH: 25
    highH: 85
    lowS: 50
    highS: 255
    lowV: 80
    highV: 255
  contours:
    min_area: 100
    max_area: 50000
    min_circularity: 0.5
    min_fill_ratio: 0.7
    min_aspect_ratio: 0.7

#####-----飞镖靶 PnP 靶面模型-----#####
dart_target:
  half_size: 0.07    # 靶面半边长 [m] (14cm 方形靶面)

#####-----飞镖靶跟踪参数 (图像空间 EKF)-----#####
dart_tracker:
  lost_time_thres: 2.0        # LOST 超时 [s]
  tracking_thres: 5            # 进入 TRACKING 连续检测帧数
  max_temp_lost_count: 15      # TEMP_LOST 超时帧数
  target:
    xy_r: 0.05                 # cx/cy 观测噪声 r
    wh_r: 0.05                 # w/h 观测噪声 r
    q_xy: 100.0               # cx/cy 过程噪声 q
    q_wh: 100.0               # w/h 过程噪声 q

#####-----飞镖瞄准器 (抛物线弹道)-----#####
dart_aimer:
  dart_speed: 12.0            # 飞镖初速 [m/s]
  gravity: 9.81               # 重力加速度 [m/s²]
  drag_coeff: 0.01            # 空气阻力系数 (一阶)
  yaw_offset: 0.0             # yaw 偏置 [°]
  pitch_offset: 0.0           # pitch 偏置 [°]
  pitch_scale: 1.0            # pitch 缩放
  yaw_scale: 0.5              # yaw 缩放 (归一化偏移→弧度)
  fire_tolerance_x: 0.05      # 水平射击容差 (归一化)
  fire_tolerance_y: 0.05      # 垂直射击容差 (归一化)

#####-----相机参数-----#####
camera_name: "hikrobot"
exposure_ms: 5.0
gain: 16.9
vid_pid: "2bdf:0001"

#####-----IMU 安装偏置-----#####
R_gimbal2imubody: [1, 0, 0, 0, 1, 0, 0, 0, 1]

#####-----相机内参 (标定后替换)-----#####
camera_matrix: [1785.4881526822305, 0, 672.4806478241826, 0, 1785.026019470562, 559.89603224794314, 0, 0, 1]
distort_coeffs: [-0.076005079619881746, 0.11182817466388446, 0.0005362204787722057, -0.0027546300984895122, 0]

#####-----手眼标定 (相机→云台)-----#####
R_camera2gimbal: [-0.027182119030230909, -0.12616154330853446, 0.99163723074269183, -0.99949106557517331, 0.019998323121329122, -0.024853106601381177, -0.016695575474690555, -0.99180811252093692, -0.12664093215554434]
t_camera2gimbal: [0.13160669975045827, 0.10377721766577375, 0.024908271912914642]

#####-----串口 (Gimbal I/O)-----#####
serial:
  port: "/dev/ttyACM0"
  baudrate: 115200
