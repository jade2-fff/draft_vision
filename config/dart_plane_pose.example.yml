%YAML:1.0
# PnP 平面外参标定示例。
# 坐标系建议：目标平面 Z=0，X 向右为正，Y 向上为正，单位 mm。
# 使用时请复制为 config/dart_plane_pose.yml，并把 image_points 替换为实测像素坐标。
object_points_mm:
  - [-300.0,  200.0, 0.0]
  - [ 300.0,  200.0, 0.0]
  - [ 300.0, -200.0, 0.0]
  - [-300.0, -200.0, 0.0]
image_points:
  - [135.4,  92.8]
  - [503.7,  88.1]
  - [526.2, 381.6]
  - [112.9, 386.5]
